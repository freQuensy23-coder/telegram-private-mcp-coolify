services:
  telegram-private-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
      MCP_AUTH_PASSWORD: ${MCP_AUTH_PASSWORD:-}
      MCP_PUBLIC_PREFIX: ${MCP_PUBLIC_PREFIX:-/telegram-private-mcp}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      TGCLI_STORE: /data
      PORT: 3000
    volumes:
      - telegram_private_mcp_data:/data
    ports:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.telegram-private-mcp.rule=Host(`api.fstr.cc`) && (PathPrefix(`/telegram-private-mcp`) || PathPrefix(`/.well-known/oauth-protected-resource/telegram-private-mcp`) || PathPrefix(`/.well-known/oauth-authorization-server/telegram-private-mcp`))"
      - "traefik.http.routers.telegram-private-mcp.entrypoints=http,https"
      - "traefik.http.routers.telegram-private-mcp.tls=true"
      - "traefik.http.services.telegram-private-mcp.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  telegram_private_mcp_data:
